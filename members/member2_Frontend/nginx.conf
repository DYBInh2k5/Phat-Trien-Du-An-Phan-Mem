# Cấu hình Nginx phục vụ ứng dụng React SPA Frontend (HTQLLH)
# Vị trí: members/member2_Frontend/nginx.conf

server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html index.htm;

    # Kích hoạt Gzip nén dữ liệu truyền tải
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;
    gzip_min_length 1000;

    # Proxy các yêu cầu API sang Backend container
    location /api/ {
        proxy_pass http://backend-api:8081;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Định tuyến React Router SPA: nếu không tìm thấy tệp tĩnh, trả về index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Bộ nhớ đệm cho tài nguyên tĩnh bất biến (hashed assets)
    location ~* \.(?:css|js|woff2?|svg|png|jpg|jpeg|gif|ico)$ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
