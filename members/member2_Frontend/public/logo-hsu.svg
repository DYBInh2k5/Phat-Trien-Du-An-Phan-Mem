<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <!-- Radial gradient for emblem badge background -->
    <radialGradient id="badgeGlow" cx="50%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#1e40af" />
      <stop offset="60%" stop-color="#004ac6" />
      <stop offset="100%" stop-color="#0f172a" />
    </radialGradient>
    <!-- Gold gradient for rings, star, and accents -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047" />
      <stop offset="50%" stop-color="#eab308" />
      <stop offset="100%" stop-color="#ca8a04" />
    </linearGradient>
    <!-- Lotus petal soft gradient -->
    <linearGradient id="lotusGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#fef08a" />
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Outer Ring with Gold Border -->
  <circle cx="100" cy="100" r="94" fill="url(#badgeGlow)" stroke="url(#goldGrad)" stroke-width="4.5" filter="url(#softShadow)" />

  <!-- Inner Dotted Security / Academic Ring -->
  <circle cx="100" cy="100" r="86" fill="none" stroke="#60a5fa" stroke-width="1.2" stroke-dasharray="3,3" opacity="0.7" />

  <!-- Upper Arch Ribbon / Text Arc -->
  <path id="textArcTop" d="M 32,100 A 68,68 0 1,1 168,100" fill="none" />
  <text font-family="'Inter', sans-serif" font-size="9" font-weight="800" fill="#fef08a" letter-spacing="2.2" text-anchor="middle">
    <textPath href="#textArcTop" startOffset="50%">TRƯỜNG THPT HOA SEN</textPath>
  </text>

  <!-- Lower Arch Ribbon / Text Arc -->
  <path id="textArcBottom" d="M 168,100 A 68,68 0 0,1 32,100" fill="none" />
  <text font-family="'Inter', sans-serif" font-size="8" font-weight="700" fill="#93c5fd" letter-spacing="1.8" text-anchor="middle">
    <textPath href="#textArcBottom" startOffset="50%">• HSU DIGITAL CAMPUS •</textPath>
  </text>

  <!-- Inner Shield Base -->
  <g transform="translate(100, 102)">
    <!-- Graduation Cap (Mũ cử nhân) -->
    <path d="M 0,-34 L 32,-22 L 0,-10 L -32,-22 Z" fill="url(#goldGrad)" stroke="#ffffff" stroke-width="1" />
    <polygon points="0,-10 24,-19 24,-12 0,-3" fill="#ca8a04" opacity="0.8" />
    <!-- Tassel (Tua mũ) -->
    <path d="M 22,-18 C 26,-14 27,-8 27,-3" fill="none" stroke="#fef08a" stroke-width="2" />
    <circle cx="27" cy="-2" r="2" fill="#fde047" />

    <!-- Open Book (Quyển sách tri thức) -->
    <path d="M -30,12 C -15,8 0,12 0,16 C 0,12 15,8 30,12 L 28,26 C 14,22 0,26 0,28 C 0,26 -14,22 -28,26 Z" fill="#ffffff" stroke="#cbd5e1" stroke-width="0.8" />
    <path d="M 0,16 L 0,28" stroke="#94a3b8" stroke-width="1.2" />

    <!-- Stylized Golden Lotus (Hoa Sen HSU) -->
    <!-- Center petal -->
    <path d="M 0,-6 C -6,4 -4,14 0,18 C 4,14 6,4 0,-6 Z" fill="url(#lotusGrad)" stroke="url(#goldGrad)" stroke-width="1.2" />
    <!-- Left petal -->
    <path d="M -2,4 C -16,6 -18,16 -6,18 C -2,18 -1,10 -2,4 Z" fill="url(#lotusGrad)" stroke="url(#goldGrad)" stroke-width="1" />
    <!-- Right petal -->
    <path d="M 2,4 C 16,6 18,16 6,18 C 2,18 1,10 2,4 Z" fill="url(#lotusGrad)" stroke="url(#goldGrad)" stroke-width="1" />

    <!-- Core Star of Excellence -->
    <polygon points="0,5 2,9 6,9 3,12 4,16 0,13 -4,16 -3,12 -6,9 -2,9" fill="#f59e0b" />
  </g>
</svg>
