spring.application.name=school-management

# Kết nối PostgreSQL (Hỗ trợ URL cổng 5432 / 5434 hoặc qua biến môi trường)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5434/school_management}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:school_app}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${DB_PASSWORD:postgres}}
spring.datasource.driver-class-name=org.postgresql.Driver

# Cấu hình Hibernate JPA tự động tạo/cập nhật bảng trên PostgreSQL
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Cổng khởi chạy Backend API
server.port=8081

